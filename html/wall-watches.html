<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sharma Watch Repair</title>

    <!-- Website Favicon -->
    <link rel="icon" type="image/png" href="../images/sharmawatchlogo.jpeg">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

      <!-- Common CSS -->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/wall-watches.css">
</head>
<body>
  <!-- Header -->
    <div id="header"></div>
    <!-- Page Heading -->
    <section class="wall-watch-heading">
        <div class="container-fluid">
            <h1>Wall Watches</h1>
            <p>Explore wall watches by price and brand</p>
        </div>
    </section>

    <!-- Main Product Section -->
    <main class="container-fluid wall-watch-container">

        <!-- Mobile Filter Buttons -->
        <div class="mobile-filter-buttons">
            <button type="button"
                    class="mobile-filter-btn"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#filterDrawer"
                    aria-controls="filterDrawer">
                <i class="bi bi-sliders"></i> Filter by Price
            </button>

            <button type="button"
                    class="mobile-filter-btn"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#filterDrawer"
                    aria-controls="filterDrawer">
                <i class="bi bi-tag"></i> Filter by Brand
            </button>
        </div>

        <div class="wall-watch-layout">

            <!-- Desktop Sidebar -->
            <aside class="filter-sidebar">

                <div class="filter-heading">
                    <h2>Filters</h2>
                    <button type="button" id="clearFilters">
                        Clear All
                    </button>
                </div>

                <!-- Price Filter -->
                <div class="filter-group">
                    <h3>Price Range</h3>

                    <label class="filter-option">
                        <input type="checkbox" name="price"
                               value="200-300">
                        <span>₹200 – ₹300</span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="price"
                               value="300-500">
                        <span>₹300 – ₹500</span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="price"
                               value="500-1000">
                        <span>₹500 – ₹1,000</span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="price"
                               value="1000-plus">
                        <span>₹1,000 and above</span>
                    </label>
                </div>

                <!-- Brand Filter -->
                <div class="filter-group">
                    <h3>Brands</h3>

                    <label class="filter-option">
                        <input type="checkbox" name="brand"
                               value="Titan">
                        <span>Titan</span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="brand"
                               value="Sonata">
                        <span>Sonata</span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="brand"
                               value="Maxima">
                        <span>Maxima</span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="brand"
                               value="Timex">
                        <span>Timex</span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="brand"
                               value="Other Brands">
                        <span>Other Brands</span>
                    </label>
                </div>

            </aside>

            <!-- Product Area -->
            <section class="wall-watch-products">

                <div class="products-toolbar">
                    <div>
                        <h2>Our Collection</h2>
                        <p id="productCount">Showing all watches</p>
                    </div>

                    <select id="sortProducts" aria-label="Sort products">
                        <option value="default">Sort: Default</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                        <option value="name">Name: A to Z</option>
                    </select>
                </div>

                <!-- JavaScript products will appear here -->
                <div class="product-grid" id="productGrid"></div>

                <div class="no-products" id="noProducts" hidden>
                    <i class="bi bi-search"></i>
                    <h3>No watches found</h3>
                    <p>Try selecting a different price range or brand.</p>
                    <button type="button" id="resetNoProducts">
                        Clear Filters
                    </button>
                </div>

            </section>
        </div>
    </main>

    <!-- Mobile Filter Drawer -->
    <div class="offcanvas offcanvas-bottom mobile-filter-drawer"
         tabindex="-1"
         id="filterDrawer"
         aria-labelledby="filterDrawerTitle">

        <div class="offcanvas-header">
            <h2 class="offcanvas-title" id="filterDrawerTitle">
                Filter Watches
            </h2>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas"
                    aria-label="Close"></button>
        </div>

        <div class="offcanvas-body">

            <div class="filter-group">
                <h3>Price Range</h3>

                <label class="filter-option">
                    <input type="checkbox" name="price"
                           value="200-300">
                    <span>₹200 – ₹300</span>
                </label>

                <label class="filter-option">
                    <input type="checkbox" name="price"
                           value="300-500">
                    <span>₹300 – ₹500</span>
                </label>

                <label class="filter-option">
                    <input type="checkbox" name="price"
                           value="500-1000">
                    <span>₹500 – ₹1,000</span>
                </label>

                <label class="filter-option">
                    <input type="checkbox" name="price"
                           value="1000-plus">
                    <span>₹1,000 and above</span>
                </label>
            </div>

            <div class="filter-group">
                <h3>Brands</h3>

                <label class="filter-option">
                    <input type="checkbox" name="brand"
                           value="Titan">
                    <span>Titan</span>
                </label>

                <label class="filter-option">
                    <input type="checkbox" name="brand"
                           value="Sonata">
                    <span>Sonata</span>
                </label>

                <label class="filter-option">
                    <input type="checkbox" name="brand"
                           value="Maxima">
                    <span>Maxima</span>
                </label>

                <label class="filter-option">
                    <input type="checkbox" name="brand"
                           value="Timex">
                    <span>Timex</span>
                </label>

                <label class="filter-option">
                    <input type="checkbox" name="brand"
                           value="Other Brands">
                    <span>Other Brands</span>
                </label>
            </div>

            <div class="drawer-actions">
                <button type="button" id="drawerClearFilters">
                    Clear All
                </button>

                <button type="button"
                        data-bs-dismiss="offcanvas"
                        class="apply-filter-btn">
                    Show Watches
                </button>
            </div>

        </div>
    </div>
<div id="footer"></div>
  <!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Header/Footer aur common links -->
<script src="../js/script.js" defer></script>

<!-- Wall Watches filters -->
<script src="../js/wall-watches.js" defer></script>

</body>
</html>
