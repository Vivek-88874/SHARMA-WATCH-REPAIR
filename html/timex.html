<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sharma Watch Repair</title>

    <!-- Website Favicon -->
    <link rel="icon" type="image/png" href="images/sharmawatchlogo.jpeg">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Common CSS -->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- Timex CSS -->
    <link rel="stylesheet" href="../css/timex.css">
</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Timex Collection -->
    <section class="timex-gallery container-fluid py-5">

        <div class="gallery-heading text-center mb-4">
            <span class="gallery-subtitle">OUR COLLECTION</span>
            <h1>TIMEX WATCH COLLECTION</h1>
            <p>Explore watches from our Timex collections.</p>
        </div>

        <!-- Category Buttons -->
        <div class="category-buttons text-center mb-4">

            <button class="category-btn active" data-brand="All">
                All
            </button>

            <button class="category-btn" data-brand="TMX">
                TMX
            </button>

            <button class="category-btn" data-brand="Fria">
                Fria
            </button>

            <button class="category-btn" data-brand="Timex Signio">
                Timex Signio
            </button>

            <button class="category-btn" data-brand="Guess">
                Guess
            </button>

        </div>

        <!-- Selected Category Heading -->
        <h3 id="brandTitle" class="text-center mb-4">
            All Timex Watches
        </h3>

        <!-- Watches JavaScript se show hongi -->
        <div class="row g-4" id="watchContainer"></div>

    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Common Header/Footer -->
    <script src="../js/script.js"></script>

    <!-- Timex Category Filter -->
    <script src="../js/timex.js"></script>

</body>

</html>
