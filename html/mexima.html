<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mexima Watch Collection | Sharma Watch Repair</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Common CSS -->
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- Mexima CSS -->
    <link rel="stylesheet" href="../css/mexmia.css">
</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <!-- Mexima Watch Collection -->
    <section class="mexima-gallery container py-5">

        <div class="gallery-heading text-center mb-5">
            <span class="gallery-subtitle">OUR COLLECTION</span>
            <h1>MEXIMA WATCH COLLECTION</h1>
            <p>Explore our exclusive watch collections.</p>
        </div>

        <!-- Category Buttons -->
        <div class="category-buttons text-center mb-4">

            <button class="category-btn active" data-brand="All">
                All
            </button>

            <button class="category-btn" data-brand="Soffile">
                Soffile
            </button>

            <button class="category-btn" data-brand="Tissot Leccuper">
                Tissot Leccuper
            </button>

        </div>

        <!-- Selected Category Heading -->
        <h3 id="brandTitle" class="text-center mb-4">
            All Mexima Watches
        </h3>

        <!-- Watch Cards -->
        <div class="row g-4" id="watchContainer"></div>

    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common Header and Footer -->
    <script src="../js/script.js"></script>

    <!-- Mexima Category Filter -->
    <script src="../js/mexima.js"></script>

</body>

</html>
