<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Titan Watch Collection</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="../css/titan.css">
</head>
<body>

<section  class="titan-gallery container py-5">

    <div class="gallery-heading text-center mb-4">
        <h1>WATCH COLLECTION</h1>
        <p>Explore watches from your favourite brands.</p>
    </div>

    <!-- Category Buttons -->
    <div class="category-buttons mb-4">
        <button class="category-btn active" data-brand="All">All</button>
        <button class="category-btn" data-brand="Sonata">Sonata</button>
        <button class="category-btn" data-brand="Fastrack">Fastrack</button>
        <button class="category-btn" data-brand="Zoop by Titan">Zoop by Titan</button>
        <button class="category-btn" data-brand="Tommy Hilfiger">Tommy Hilfiger</button>
        <button class="category-btn" data-brand="Kenneth Cole">Kenneth Cole</button>
        <button class="category-btn" data-brand="Anne Klein">Anne Klein</button>
        <button class="category-btn" data-brand="Police">Police</button>
        <button class="category-btn" data-brand="Titan Smart Nebula">Titan Smart Nebula</button>
    </div>

    <!-- Selected Category -->
    <h3 id="brandTitle" class="text-center mb-4">Sonata Watches</h3>

    <!-- Watch Cards JavaScript se aayenge -->
    <div class="row g-4" id="watchContainer"></div>

</section>

    <script src="../js/titan.js"></script>
</body>
</html>
